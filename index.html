function updatePresenterStatus(){
  let next="—";
  for(let i=S.tIndex;i<TIMELINE.length;i++){
    const ev=TIMELINE[i];
    if(["GOAL","HALFTIME","FULLTIME","WHO_SCORES_FIRST"].includes(ev.type)){
      next=`${ev.min}' ${ev.type.replace(/_/g," ")}`; break; }
  }
  let st="";
  if(S.phase==="INTRO") st="Patron is on the welcome screen.";
  else if(S.phase==="RULES") st="Patron is reading the rules.";
  else if(S.phase==="BUILD") st="Patron is building a lineup.";
  else if(S.phase==="READY") st="<b>Ready.</b> Press ▶ Play (or Next Event →) to kick off.";
  else if(S.phase==="FT") st="<b>Full-Time.</b> Scoring settled.";
  else st=`<b>${S.clock.minute}'</b> · ${esc(scoreStr())} · next: ${esc(next)}`+
    (S.activeWindow?` · <span style="color:var(--gold)">window open</span>`:"");
  $("pStatus").innerHTML=st;
  const mini=$("pStatusMini");
  if(mini){
    mini.textContent = S.phase==="INTRO" ? "Welcome screen"
      : S.phase==="RULES" ? "Reading rules"
      : S.phase==="BUILD" ? "Building lineup"
      : S.phase==="READY" ? "Ready — press ▶ Play"
      : S.phase==="FT" ? "Full-Time — scoring settled"
      : S.clock.minute+"' · "+scoreStr()+(S.activeWindow?" · window open":"");
  }
  const pn=$("pNext"); if(pn) pn.disabled=(S.phase==="INTRO"||S.phase==="RULES"||S.phase==="BUILD"||S.phase==="FT");
}

/* ---------------------------------------------------------------------------
   12. QR CODE — "Scan to play". Self-contained, offline (no CDN): a compact
   port of Nayuki's public-domain QR Code generator (byte mode, ECC Medium).
   Works on a bar Wi-Fi or the presenter's phone hotspot with no internet.
   --------------------------------------------------------------------------- */
var QRC=(function(){
  "use strict";
  // ECC = Medium. Index 0 is padding (unused); entries are versions 1..40.
  var ECB =[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  var NBLK=[-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];

  function getBit(x,i){ return ((x>>>i)&1)!=0; }
  function rsMul(x,y){ var z=0;
    for(var i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; }
    return z&0xFF; }
  function rsDivisor(degree){
    var result=[]; for(var i=0;i<degree-1;i++) result.push(0); result.push(1);
    var root=1;
    for(var i=0;i<degree;i++){
      for(var j=0;j<result.length;j++){
        result[j]=rsMul(result[j],root);
        if(j+1<result.length) result[j]^=result[j+1];
      }
      root=rsMul(root,2);
    }
    return result;
  }
  function rsRemainder(data,divisor){
    var result=divisor.map(function(){return 0;});
    data.forEach(function(b){
      var factor=b ^ result.shift();
      result.push(0);
      divisor.forEach(function(d,i){ result[i]^=rsMul(d,factor); });
    });
    return result;
  }
  function getNumRawDataModules(ver){
    var result=(16*ver+128)*ver+64;
    if(ver>=2){
      var numAlign=Math.floor(ver/7)+2;
      result-=(25*numAlign-10)*numAlign-55;
      if(ver>=7) result-=36;
    }
    return result;
  }
  function getNumDataCodewords(ver){
    return Math.floor(getNumRawDataModules(ver)/8) - ECB[ver]*NBLK[ver];
  }

  function QrCode(ver,dataCodewords,msk){
    this.version=ver; this.size=ver*4+17;
    this.modules=[]; this.isFunction=[];
    for(var i=0;i<this.size;i++){
      var a=[],b=[];
      for(var j=0;j<this.size;j++){ a.push(false); b.push(false); }
      this.modules.push(a); this.isFunction.push(b);
    }
    this.drawFunctionPatterns();
    var all=this.addEccAndInterleave(dataCodewords);
    this.drawCodewords(all);
    if(msk==-1){
      var minPenalty=1e9;
      for(var m=0;m<8;m++){
        this.applyMask(m); this.drawFormatBits(m);
        var p=this.getPenaltyScore();
        if(p<minPenalty){ msk=m; minPenalty=p; }
        this.applyMask(m);
      }
    }
    this.mask=msk;
    this.applyMask(msk);
    this.drawFormatBits(msk);
  }
  QrCode.prototype.setFn=function(x,y,d){ this.modules[y][x]=d; this.isFunction[y][x]=true; };
  QrCode.prototype.drawFunctionPatterns=function(){
    for(var i=0;i<this.size;i++){ this.setFn(6,i,i%2==0); this.setFn(i,6,i%2==0); }
    this.drawFinder(3,3); this.drawFinder(this.size-4,3); this.drawFinder(3,this.size-4);
    var ap=this.alignPositions(), n=ap.length;
    for(var i=0;i<n;i++) for(var j=0;j<n;j++)
      if(!((i==0&&j==0)||(i==0&&j==n-1)||(i==n-1&&j==0))) this.drawAlign(ap[i],ap[j]);
    this.drawFormatBits(0); this.drawVersion();
  };
  QrCode.prototype.drawFormatBits=function(mask){
    var data=(0<<3)|mask, rem=data;          // Medium formatBits = 0
    for(var i=0;i<10;i++) rem=(rem<<1)^((rem>>>9)*0x537);
    var bits=((data<<10)|rem)^0x5412;
    for(var i=0;i<=5;i++) this.setFn(8,i,getBit(bits,i));
    this.setFn(8,7,getBit(bits,6)); this.setFn(8,8,getBit(bits,7));
    this.setFn(7,8,getBit(bits,8));
    for(var i=9;i<15;i++) this.setFn(14-i,8,getBit(bits,i));
    for(var i=0;i<8;i++) this.setFn(this.size-1-i,8,getBit(bits,i));
    for(var i=8;i<15;i++) this.setFn(8,this.size-15+i,getBit(bits,i));
    this.setFn(8,this.size-8,true);
  };
  QrCode.prototype.drawVersion=function(){
    if(this.version<7) return;
    var rem=this.version;
    for(var i=0;i<12;i++) rem=(rem<<1)^((rem>>>11)*0x1F25);
    var bits=this.version<<12|rem;
    for(var i=0;i<18;i++){
      var c=getBit(bits,i), a=this.size-11+i%3, b=Math.floor(i/3);
      this.setFn(a,b,c); this.setFn(b,a,c);
    }
  };
  QrCode.prototype.drawFinder=function(x,y){
    for(var dy=-4;dy<=4;dy++) for(var dx=-4;dx<=4;dx++){
      var dist=Math.max(Math.abs(dx),Math.abs(dy)), xx=x+dx, yy=y+dy;
      if(0<=xx&&xx<this.size&&0<=yy&&yy<this.size) this.setFn(xx,yy,dist!=2&&dist!=4);
    }
  };
  QrCode.prototype.drawAlign=function(x,y){
    for(var dy=-2;dy<=2;dy++) for(var dx=-2;dx<=2;dx++)
      this.setFn(x+dx,y+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1);
  };
  QrCode.prototype.alignPositions=function(){
    if(this.version==1) return [];
    var n=Math.floor(this.version/7)+2;
    var step=(this.version==32)?26:Math.ceil((this.version*4+4)/(n*2-2))*2;
    var result=[6];
    for(var pos=this.size-7; result.length<n; pos-=step) result.splice(1,0,pos);
    return result;
  };
  QrCode.prototype.addEccAndInterleave=function(data){
    var ver=this.version, numBlocks=NBLK[ver], blockEccLen=ECB[ver];
    var rawCodewords=Math.floor(getNumRawDataModules(ver)/8);
    var numShort=numBlocks-rawCodewords%numBlocks;
    var shortLen=Math.floor(rawCodewords/numBlocks);
    var blocks=[], rsDiv=rsDivisor(blockEccLen);
    for(var i=0,k=0;i<numBlocks;i++){
      var dat=data.slice(k, k+shortLen-blockEccLen+(i<numShort?0:1));
      k+=dat.length;
      var ecc=rsRemainder(dat,rsDiv);
      if(i<numShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    var result=[];
    for(var i=0;i<blocks[0].length;i++) for(var j=0;j<blocks.length;j++)
      if(i!=shortLen-blockEccLen || j>=numShort) result.push(blocks[j][i]);
    return result;
  };
  QrCode.prototype.drawCodewords=function(data){
    var i=0;
    for(var right=this.size-1; right>=1; right-=2){
      if(right==6) right=5;
      for(var vert=0;vert<this.size;vert++) for(var j=0;j<2;j++){
        var x=right-j, up=((right+1)&2)==0, y=up?this.size-1-vert:vert;
        if(!this.isFunction[y][x] && i<data.length*8){
          this.modules[y][x]=getBit(data[i>>>3],7-(i&7)); i++;
        }
      }
    }
  };
  QrCode.prototype.applyMask=function(mask){
    for(var y=0;y<this.size;y++) for(var x=0;x<this.size;x++){
      var inv;
      switch(mask){
        case 0: inv=(x+y)%2==0; break;
        case 1: inv=y%2==0; break;
        case 2: inv=x%3==0; break;
        case 3: inv=(x+y)%3==0; break;
        case 4: inv=(Math.floor(x/3)+Math.floor(y/2))%2==0; break;
        case 5: inv=(x*y%2)+(x*y%3)==0; break;
        case 6: inv=((x*y%2)+(x*y%3))%2==0; break;
        case 7: inv=(((x+y)%2)+(x*y%3))%2==0; break;
      }
      if(!this.isFunction[y][x] && inv) this.modules[y][x]=!this.modules[y][x];
    }
  };
  QrCode.prototype.fpAdd=function(run,h){ if(h[0]==0) run+=this.size; h.pop(); h.unshift(run); };
  QrCode.prototype.fpCount=function(h){
    var n=h[1];
    var core = n>0 && h[2]==n && h[3]==n*3 && h[4]==n && h[5]==n;
    return (core && h[0]>=n*4 && h[6]>=n ?1:0) + (core && h[6]>=n*4 && h[0]>=n ?1:0);
  };
  QrCode.prototype.fpTerm=function(col,len,h){
    if(col){ this.fpAdd(len,h); len=0; }
    len+=this.size; this.fpAdd(len,h); return this.fpCount(h);
  };
  QrCode.prototype.getPenaltyScore=function(){
    var result=0, size=this.size, M=this.modules;
    for(var y=0;y<size;y++){
      var col=false, run=0, h=[0,0,0,0,0,0,0];
      for(var x=0;x<size;x++){
        if(M[y][x]==col){ run++; if(run==5) result+=3; else if(run>5) result++; }
        else { this.fpAdd(run,h); if(!col) result+=this.fpCount(h)*40; col=M[y][x]; run=1; }
      }
      result+=this.fpTerm(col,run,h)*40;
    }
    for(var x=0;x<size;x++){
      var col=false, run=0, h=[0,0,0,0,0,0,0];
      for(var y=0;y<size;y++){
        if(M[y][x]==col){ run++; if(run==5) result+=3; else if(run>5) result++; }
        else { this.fpAdd(run,h); if(!col) result+=this.fpCount(h)*40; col=M[y][x]; run=1; }
      }
      result+=this.fpTerm(col,run,h)*40;
    }
    for(var y=0;y<size-1;y++) for(var x=0;x<size-1;x++){
      var c=M[y][x];
      if(c==M[y][x+1]&&c==M[y+1][x]&&c==M[y+1][x+1]) result+=3;
    }
    var dark=0;
    for(var y=0;y<size;y++) for(var x=0;x<size;x++) if(M[y][x]) dark++;
    var total=size*size;
    result += (Math.ceil(Math.abs(dark*20-total*10)/total)-1)*10;
    return result;
  };

  function toUtf8(s){
    var out=[];
    for(var i=0;i<s.length;i++){
      var c=s.charCodeAt(i);
      if(c<0x80) out.push(c);
      else if(c<0x800) out.push(0xC0|(c>>6),0x80|(c&0x3F));
      else if(c<0xD800||c>=0xE000) out.push(0xE0|(c>>12),0x80|((c>>6)&0x3F),0x80|(c&0x3F));
      else { i++; var c2=s.charCodeAt(i);
        var cp=0x10000+((c-0xD800)<<10)+(c2-0xDC00);
        out.push(0xF0|(cp>>18),0x80|((cp>>12)&0x3F),0x80|((cp>>6)&0x3F),0x80|(cp&0x3F)); }
    }
    return out;
  }
  function encodeText(text){
    var bytes=toUtf8(text), ver, capBits=0;
    for(ver=1;ver<=40;ver++){
      var cap=getNumDataCodewords(ver)*8;
      var cc=(ver<=9)?8:16;
      if(4+cc+bytes.length*8 <= cap){ capBits=cap; break; }
    }
    if(ver>40) throw new Error("Data too long for QR");
    var bb=[];
    function put(val,len){ for(var i=len-1;i>=0;i--) bb.push((val>>>i)&1); }
    put(0x4,4);
    put(bytes.length,(ver<=9)?8:16);
    bytes.forEach(function(b){ put(b,8); });
    put(0,Math.min(4,capBits-bb.length));
    put(0,(8-bb.length%8)%8);
    for(var pad=0xEC; bb.length<capBits; pad^=0xEC^0x11) put(pad,8);
    var dat=new Array(capBits/8).fill(0);
    bb.forEach(function(bit,i){ if(bit) dat[i>>>3]|=1<<(7-(i&7)); });
    return new QrCode(ver,dat,-1);
  }
  function draw(qr,canvas,border,scale){
    var dim=qr.size+border*2;
    canvas.width=dim*scale; canvas.height=dim*scale;
    var ctx=canvas.getContext("2d");
    ctx.fillStyle="#FFFFFF"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#000000";
    for(var y=0;y<qr.size;y++) for(var x=0;x<qr.size;x++)
      if(qr.modules[y][x]) ctx.fillRect((x+border)*scale,(y+border)*scale,scale,scale);
  }
  return {encodeText:encodeText, draw:draw};
})();

// The presenter types ONLY the laptop's LAN IP; the demo URL is built as
// http://<IP>:8123/ (8123 = the http.server port; server binding unchanged).
var QR_PORT=8123;
var QR_STATE={ip:null};
function isValidIp(s){
  s=(s||"").trim();
  var p=s.split(".");
  if(p.length!==4) return false;
  return p.every(function(o){ return /^\d{1,3}$/.test(o) && Number(o)<=255; });
}
function qrBuildUrl(ip){ return "http://"+ip.trim()+":"+QR_PORT+"/"; }
function guessLanIp(){
  try{
    var h=location.hostname;
    if(isValidIp(h) && !/^127\./.test(h) && h!=="0.0.0.0") return h;
  }catch(e){}
  return "";
}
function openQR(){ if(QR_STATE.ip==null) QR_STATE.ip=guessLanIp(); renderQR(); }
function closeQR(){ $("qrRoot").innerHTML=""; }
function qrSetIp(v){ QR_STATE.ip=(v||"").trim(); renderQR(); }
function renderQR(){
  var ip=QR_STATE.ip||"";
  var valid=isValidIp(ip);
  var url=valid?qrBuildUrl(ip):null;
  var hasError=ip.length>0 && !valid;
  $("qrRoot").innerHTML=`<div class="scrim" onclick="if(event.target===this)closeQR()">
    <div class="window">
      <div class="wt">Demo Entry</div>
      <h2>Scan to play</h2>
      <p class="muted">Type the laptop's Wi-Fi/LAN IP address below. The link and
      QR build automatically — no URL to hand-edit. Phone and laptop must be on
      the same network (or the presenter's hotspot).</p>
      <div class="qrwrap">
        <div class="qrbox"><canvas id="qrCanvas"></canvas></div>
        <div class="qrlabel">Scan to play</div>
        <div class="qrurl">${valid?esc(url):"&nbsp;"}</div>
      </div>
      <label class="note" for="qrIp">Laptop LAN IP (e.g. 192.168.1.23)</label>
      <input class="qrinput" id="qrIp" value="${esc(ip)}" inputmode="decimal"
        onchange="qrSetIp(this.value)" onkeyup="if(event.key==='Enter')qrSetIp(this.value)"
        placeholder="192.168.1.23">
      ${hasError?`<div class="qrerr">Not a valid IPv4 address — enter four numbers
        like <b>192.168.1.23</b> (find it via <b>ipconfig getifaddr en0</b> on
        Mac, <b>ipconfig</b> on Windows).</div>`:
        `<div class="note">Builds <b>http://&lt;IP&gt;:${QR_PORT}/</b> · the server
         must be running on port ${QR_PORT}.</div>`}
      <div class="btnrow"><button class="btn" onclick="closeQR()">Done</button></div>
    </div></div>`;
  var c=$("qrCanvas");
  if(!valid){
    c.width=300; c.height=300;
    var x=c.getContext("2d");
    x.fillStyle="#fff"; x.fillRect(0,0,300,300);
    x.fillStyle="#888"; x.font="15px sans-serif"; x.textAlign="center";
    x.fillText("Enter the laptop's LAN IP",150,145);
    x.fillText("to generate the QR code",150,168);
    return;
  }
  try{
    QRC.draw(QRC.encodeText(url), c, 4, 6);
  }catch(e){
    c.width=300; c.height=80;
    var x=c.getContext("2d");
    x.fillStyle="#fff"; x.fillRect(0,0,300,80);
    x.fillStyle="#000"; x.font="14px sans-serif"; x.textAlign="center";
    x.fillText("Could not generate QR for that address",150,44);
  }
}

/* boot */
setupSpeedButtons();
render();
updatePresenterStatus();
</script>
